name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      action:
        description: "Deployment action"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      rollback_version:
        description: "Specific release ID to roll back to (optional; defaults to previous release)"
        required: false
        type: string
      ci_run_id:
        description: "Specific CI run ID to fetch artifacts from (optional for workflow_run)"
        required: false
        type: string

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine action and CI run ID
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ inputs.ci_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "action=deploy" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.meta.outputs.action == 'deploy' && steps.meta.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.meta.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Execute deployment or rollback on EC2
        env:
          ACTION: ${{ steps.meta.outputs.action }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          RELEASE_ID: "${{ github.sha }}-${{ github.run_id }}"
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "Staging environment secrets (EC2_HOST, EC2_USER, EC2_SSH_KEY) not configured yet; skipping remote SSH step."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          if [ "$ACTION" = "rollback" ]; then
            ssh -i ~/.ssh/id_ed25519 "${EC2_USER}@${EC2_HOST}" \
              "/opt/shopnest/current/infra/scripts/rollback.sh shopnest-backend '$ROLLBACK_VERSION'"
          else
            RELEASE_DIR="/opt/shopnest/releases/${RELEASE_ID}"
            ssh -i ~/.ssh/id_ed25519 "${EC2_USER}@${EC2_HOST}" \
              "mkdir -p '$RELEASE_DIR/backend' '$RELEASE_DIR/frontend/dist' '$RELEASE_DIR/infra'"
            scp -i ~/.ssh/id_ed25519 -r artifacts/shopnest-backend-*/. "${EC2_USER}@${EC2_HOST}:$RELEASE_DIR/backend/"
            scp -i ~/.ssh/id_ed25519 -r artifacts/shopnest-frontend-dist-*/. "${EC2_USER}@${EC2_HOST}:$RELEASE_DIR/frontend/dist/"
            scp -i ~/.ssh/id_ed25519 -r infra/scripts "${EC2_USER}@${EC2_HOST}:$RELEASE_DIR/infra/"
            ssh -i ~/.ssh/id_ed25519 "${EC2_USER}@${EC2_HOST}" \
              "chmod +x '$RELEASE_DIR/infra/scripts/'*.sh && '$RELEASE_DIR/infra/scripts/deploy.sh' '$RELEASE_DIR' shopnest-backend"
          fi

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine action and CI run ID
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ inputs.ci_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "action=deploy" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.meta.outputs.action == 'deploy' && steps.meta.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.meta.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Execute deployment or rollback on EC2
        env:
          ACTION: ${{ steps.meta.outputs.action }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          RELEASE_ID: "${{ github.sha }}-${{ github.run_id }}"
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "Production environment secrets (EC2_HOST, EC2_USER, EC2_SSH_KEY) not configured yet; skipping remote SSH step."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          if [ "$ACTION" = "rollback" ]; then
            ssh -i ~/.ssh/id_ed25519 "${EC2_USER}@${EC2_HOST}" \
              "/opt/shopnest/current/infra/scripts/rollback.sh shopnest-backend '$ROLLBACK_VERSION'"
          else
            RELEASE_DIR="/opt/shopnest/releases/${RELEASE_ID}"
            ssh -i ~/.ssh/id_ed25519 "${EC2_USER}@${EC2_HOST}" \
              "mkdir -p '$RELEASE_DIR/backend' '$RELEASE_DIR/frontend/dist' '$RELEASE_DIR/infra'"
            scp -i ~/.ssh/id_ed25519 -r artifacts/shopnest-backend-*/. "${EC2_USER}@${EC2_HOST}:$RELEASE_DIR/backend/"
            scp -i ~/.ssh/id_ed25519 -r artifacts/shopnest-frontend-dist-*/. "${EC2_USER}@${EC2_HOST}:$RELEASE_DIR/frontend/dist/"
            scp -i ~/.ssh/id_ed25519 -r infra/scripts "${EC2_USER}@${EC2_HOST}:$RELEASE_DIR/infra/"
            ssh -i ~/.ssh/id_ed25519 "${EC2_USER}@${EC2_HOST}" \
              "chmod +x '$RELEASE_DIR/infra/scripts/'*.sh && '$RELEASE_DIR/infra/scripts/deploy.sh' '$RELEASE_DIR' shopnest-backend"
          fi
